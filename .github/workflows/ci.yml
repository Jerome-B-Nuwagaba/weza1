name: CI

on:
  push:
    branches: [main, test/e2e-integration]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-api:
    name: Core API — lint, security scan, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/core-api
    env:
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core-api/requirements.txt
      - run: pip install -r requirements.txt pytest ruff bandit pip-audit
      - run: ruff check weza tests
      - run: bandit -q -r weza -x weza/seed.py -s B101,B105,B106,B311,B608
      - name: Require a single Alembic migration head
        run: |
          set -euo pipefail
          heads="$(alembic heads | grep -c '(head)')"
          echo "Alembic heads: $heads"
          test "$heads" -eq 1
      - run: pip-audit -r requirements.txt --progress-spinner off || true
      - run: pytest -q -p no:cacheprovider

  api-image:
    name: Core API — Docker image (as deployed on Render)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weza
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t weza-api services/core-api
      - name: Boot container (migrate + seed + serve) and smoke-test
        run: |
          docker run -d --name api --network host -e PORT=8000 -e ENV=dev -e SEED_DEMO=true             -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/weza             -e SECRET_KEY=ci-secret -e VAULT_MASTER_KEY=ci-vault-key -e BLIND_INDEX_KEY=ci-index weza-api
          for i in $(seq 1 60); do curl -sf localhost:8000/healthz && break; sleep 3; done
          curl -sf localhost:8000/api/v1/health
          curl -sf localhost:8000/readyz
          curl -sf localhost:8000/api/v1/public/stats | grep -q "Lakeside Bank"
          curl -sf -X POST localhost:8000/api/v1/journeys -H "Content-Type: application/json" -d "{\"channel\":\"web\",\"text\":\"I need UGX 30 million to expand my pharmacy\"}" | grep -q CONFIRM_INTENT
          docker logs api | tail -20

  web:
    name: Web — lint, typecheck & production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx next build
        env:
          API_URL: https://example.invalid

  e2e:
    name: End-to-end — institution journeys (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weza
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      API_URL: http://localhost:8000
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Boot API container with demo seed
        run: |
          docker build -t weza-api services/core-api
          docker run -d --name api --network host -e PORT=8000 -e ENV=dev -e SEED_DEMO=true -e LOGIN_IP_LIMIT=1000 -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/weza -e SECRET_KEY=ci-secret -e VAULT_MASTER_KEY=ci-vault-key -e BLIND_INDEX_KEY=ci-index weza-api
          for i in $(seq 1 60); do curl -sf localhost:8000/healthz && break; sleep 3; done
          curl -sf localhost:8000/api/v1/public/stats | grep -q "Lakeside Bank"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build web against the local API
        working-directory: apps/web
        run: |
          npm ci
          npx next build
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: apps/web
        run: npx playwright test
      - if: failure()
        run: docker logs api | tail -100
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  mobile:
    name: Flutter — analyze, test, build APK & web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=WEZA_API_URL=${{ vars.WEZA_API_URL || 'https://weza-api-go6e.onrender.com' }}
      - run: flutter build web --release --dart-define=WEZA_API_URL=${{ vars.WEZA_API_URL || 'https://weza-api-go6e.onrender.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: weza-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
