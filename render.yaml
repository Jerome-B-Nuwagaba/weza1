# Render Blueprint — WEZA core API + PostgreSQL (test/demo environment).
# Render → New → Blueprint → select this repository. Secrets are generated by Render, never stored in git.
databases:
  - name: weza-db
    plan: free            # NOTE: Render free databases expire after 30 days; switch DATABASE_URL to Neon or a paid plan to keep data.
    databaseName: weza
    user: weza

services:
  - type: web
    name: weza-api
    runtime: docker
    plan: free            # Free tier sleeps after ~15 min idle (first request then takes ~1 min). Starter keeps it warm.
    dockerfilePath: ./services/core-api/Dockerfile
    dockerContext: ./services/core-api
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: weza-db
          property: connectionString
      - key: ENV
        value: dev
      - key: SECRET_KEY
        generateValue: true
      - key: VAULT_MASTER_KEY
        generateValue: true
      - key: BLIND_INDEX_KEY
        generateValue: true
      - key: RUN_WORKER_INPROCESS   # background worker runs inside the API on the free plan
        value: "true"
      - key: SEED_DEMO              # loads fictional demo institutions/customers once (never in production)
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: OTP_DELIVERY           # shows OTP on screen until an SMS provider is connected
        value: display
      - key: CORS_ORIGINS           # bearer-token clients (Flutter web); the Next.js site proxies same-origin
        value: "*"
      - key: PUBLIC_WEB_URL
        sync: false                 # set to your Vercel URL after the web app is deployed
      - key: ANTHROPIC_API_KEY
        sync: false                 # optional
      - key: WHATSAPP_TOKEN
        sync: false                 # optional
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_BUSINESS_NUMBER   # digits with country code; powers the website's "Continue on WhatsApp" link
        sync: false
      # gnuGRID CRB (Just-In-Time credit bureau check at lender selection; see docs/CRB_VERIFICATION.md).
      # Demo: offline mock bureau. Go live: set the four GNUGRID_* values below, then GNGRID_USE_MOCK=false.
      - key: GNGRID_USE_MOCK
        value: "true"
      - key: CRB_JIT_ENABLED            # show the bureau-check step in the demo journey (mock bureau, free)
        value: "true"
      - key: GNUGRID_BASE_URL           # https URL from GnuGrid CRB, without /v1 (test URL first, live at go-live)
        sync: false
      - key: GNUGRID_CLIENT_ID
        sync: false
      - key: GNUGRID_CLIENT_SECRET
        sync: false
      - key: GNUGRID_ENQUIRY_REASON     # mandatory `reason` on every enquiry; default "For loan application"
        sync: false
      - key: GNUGRID_PI_CODE            # aggregators only
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL      # real (non-demo) environments: first WEZA administrator, created once on start
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
