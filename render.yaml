# Render Blueprint — WEZA core API + PostgreSQL (test/demo environment).
# Render → New → Blueprint → select this repository. Secrets are generated by Render, never stored in git.
databases:
  - name: weza-db
    plan: basic-256mb     # Persistent paid database: the free plan expires after 30 days.
    databaseName: weza
    user: weza

services:
  - type: web
    name: weza-api
    runtime: docker
    plan: starter         # Always on: webhook handling and queued replies must continue without a laptop.
    branch: test/e2e-integration
    dockerfilePath: ./services/core-api/Dockerfile
    dockerContext: ./services/core-api
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: weza-db
          property: connectionString
      - key: ENV
        value: dev
      - key: SECRET_KEY
        generateValue: true
      - key: VAULT_MASTER_KEY
        generateValue: true
      - key: BLIND_INDEX_KEY
        generateValue: true
      - key: RUN_WORKER_INPROCESS   # durable inbox/outbox consumer runs on Render alongside the API
        value: "true"
      - key: WHATSAPP_REQUIRED      # fail deployment instead of accepting messages with simulator-only replies
        value: "true"
      - key: SEED_DEMO              # loads fictional demo institutions/customers once (never in production)
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: OTP_DELIVERY           # shows OTP on screen until an SMS provider is connected
        value: display
      - key: CORS_ORIGINS           # bearer-token clients (Flutter web); the Next.js site proxies same-origin
        value: "*"
      - key: PUBLIC_WEB_URL
        sync: false                 # set to your Vercel URL after the web app is deployed
      - key: ANTHROPIC_API_KEY
        sync: false                 # optional
      - key: WHATSAPP_TOKEN
        sync: false                 # permanent system-user token; required on the hosted WhatsApp service
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v25.0
      - key: WHATSAPP_BUSINESS_NUMBER   # digits with country code; powers the website's "Continue on WhatsApp" link
        sync: false
      # gnuGRID CRB (Just-In-Time credit bureau check at lender selection; see docs/CRB_VERIFICATION.md).
      # Demo: offline mock bureau. Real calls require ENV=production as well as GNGRID_USE_MOCK=false,
      # IDENTITY_PROVIDER=gnugrid and the production prerequisites in docs/CRB_VERIFICATION.md.
      - key: GNGRID_USE_MOCK
        value: "true"
      - key: CRB_JIT_ENABLED            # show the bureau-check step in the demo journey (mock bureau, free)
        value: "true"
      - key: GNUGRID_BASE_URL           # https URL from GnuGrid CRB, without /v1 (test URL first, live at go-live)
        sync: false
      - key: GNUGRID_CLIENT_ID
        sync: false
      - key: GNUGRID_CLIENT_SECRET
        sync: false
      - key: GNUGRID_ENQUIRY_REASON     # mandatory `reason` on every enquiry; default "For loan application"
        sync: false
      - key: GNUGRID_PI_CODE            # aggregators only
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL      # real (non-demo) environments: first WEZA administrator, created once on start
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
